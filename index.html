    <!-- Structured Data: Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Jonatas Vitor",
      "jobTitle": "Criador de Sites e Landing Pages",
      "url": "https://jonatasvitorsites.lovable.app/",
      "image": "https://jonatasvitorsites.lovable.app/og-image.jpg",
      "description": "Especialista em criação de sites, landing pages, e-commerces e web apps com foco em conversão.",
      "areaServed": "BR",
      "knowsAbout": ["Criação de Sites", "Landing Pages", "E-commerce", "Web Apps", "Web Design", "SEO"]
    }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Quanto tempo leva para criar meu site?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Em média, entrego projetos de landing page em 5-7 dias úteis. Para sites mais complexos como e-commerces ou portfólios extensos, o prazo pode variar de 2-3 semanas. Sempre combinaremos um cronograma antes de iniciar."
          }
        },
        {
          "@type": "Question",
          "name": "O site será responsivo (funciona no celular)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! Todos os sites são desenvolvidos com abordagem mobile-first, garantindo uma experiência perfeita em qualquer dispositivo - smartphones, tablets e desktops."
          }
        },
        {
          "@type": "Question",
          "name": "Vocês oferecem suporte após a entrega?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Ofereço 30 dias de suporte gratuito após a entrega para ajustes e dúvidas. Também disponibilizo pacotes de manutenção mensal para quem precisa de atualizações contínuas."
          }
        },
        {
          "@type": "Question",
          "name": "Quais formas de pagamento são aceitas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aceito PIX, transferência bancária e cartão de crédito (parcelado em até 12x). O pagamento é dividido: 50% para iniciar o projeto e 50% na entrega."
          }
        },
        {
          "@type": "Question",
          "name": "Preciso fornecer textos e imagens?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Idealmente sim, pois você conhece melhor seu negócio. Mas posso ajudar com copywriting persuasivo e indicar bancos de imagens profissionais. Também trabalho com fotógrafos parceiros se necessário."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
